<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | ResolveX</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           ADMIN PAGE
        ========================================= */

        .admin-page {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(99, 102, 241, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(34, 211, 238, 0.08),
                    transparent 30%
                ),
                #070b17;
            color: #ffffff;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .admin-navbar {

            height: 72px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(5, 9, 22, 0.95);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            position: sticky;

            top: 0;

            z-index: 100;

            backdrop-filter: blur(15px);
        }


        .admin-logo {

            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            text-decoration: none;

            font-weight: 800;

            font-size: 20px;
        }


        .admin-logo-icon {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #22d3ee
                );

            box-shadow:
                0 8px 25px
                rgba(99,102,241,0.25);
        }


        .admin-logo span:last-child {

            color: #818cf8;
        }


        .admin-nav-links {

            display: flex;

            gap: 25px;
        }


        .admin-nav-links a {

            color: #8994aa;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            transition: 0.25s;
        }


        .admin-nav-links a:hover,
        .admin-nav-links a.active {

            color: #a5b4fc;
        }


        .admin-logout {

            border:
                1px solid
                rgba(255,255,255,0.1);

            background:
                rgba(255,255,255,0.04);

            color: #cbd5e1;

            padding:
                9px 17px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 11px;
        }


        /* =========================================
           MAIN
        ========================================= */

        .admin-container {

            width:
                min(1200px, 92%);

            margin: auto;

            padding:
                55px 0 80px;
        }


        .admin-label {

            color: #818cf8;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 10px;

            display: block;
        }


        .admin-title {

            margin: 0;

            font-size:
                clamp(35px, 5vw, 52px);

            letter-spacing: -2px;
        }


        .admin-title span {

            background:
                linear-gradient(
                    90deg,
                    #818cf8,
                    #8b5cf6,
                    #22d3ee
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .admin-description {

            color: #77839a;

            font-size: 13px;

            margin-top: 10px;

            line-height: 1.7;
        }


        /* =========================================
           STATS
        ========================================= */

        .admin-stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin:
                35px 0;
        }


        .admin-stat {

            padding: 20px;

            border-radius: 16px;

            background:
                rgba(20,28,44,0.75);

            border:
                1px solid
                rgba(148,163,184,0.12);
        }


        .admin-stat small {

            color: #758197;

            font-size: 10px;
        }


        .admin-stat strong {

            display: block;

            margin-top: 8px;

            font-size: 27px;
        }


        #adminTotal {
            color: #60a5fa;
        }


        #adminSubmitted {
            color: #fbbf24;
        }


        #adminProgress {
            color: #a78bfa;
        }


        #adminResolved {
            color: #4ade80;
        }


        /* =========================================
           PANEL
        ========================================= */

        .admin-panel {

            padding: 28px;

            border-radius: 20px;

            background:
                rgba(15,23,42,0.82);

            border:
                1px solid
                rgba(148,163,184,0.12);
        }


        .admin-panel-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        .admin-panel-header h2 {

            margin: 0;

            font-size: 19px;
        }


        .refresh-button {

            padding:
                8px 14px;

            border-radius: 8px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            background:
                rgba(255,255,255,0.04);

            color: #a5b4fc;

            cursor: pointer;

            font-size: 10px;
        }


        /* =========================================
           COMPLAINT CARD
        ========================================= */

        .admin-complaint {

            padding:
                25px 0;

            border-top:
                1px solid
                rgba(255,255,255,0.07);
        }


        .admin-complaint-top {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 15px;
        }


        .complaint-title {

            margin: 0;

            font-size: 17px;

            color: #f8fafc;
        }


        .complaint-description {

            color: #8490a5;

            font-size: 11px;

            line-height: 1.7;

            margin:
                9px 0 18px;

            max-width: 800px;
        }


        /* =========================================
           INFORMATION
        ========================================= */

        .complaint-details {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 10px;

            margin-bottom: 20px;
        }


        .detail-box {

            padding:
                12px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.06);
        }


        .detail-box small {

            display: block;

            color: #657188;

            font-size: 9px;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        .detail-box strong {

            color: #dbe4f0;

            font-size: 10px;

            word-break: break-word;
        }


        /* =========================================
           STATUS CONTROL
        ========================================= */

        .status-section {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding:
                15px;

            border-radius: 12px;

            background:
                rgba(99,102,241,0.05);

            border:
                1px solid
                rgba(99,102,241,0.12);
        }


        .current-status {

            color: #8793a9;

            font-size: 10px;
        }


        .current-status strong {

            color: #c7d2fe;

            margin-left: 5px;
        }


        .status-controls {

            display: flex;

            gap: 9px;

            align-items: center;
        }


        .status-select {

            min-width: 155px;

            height: 39px;

            padding:
                0 10px;

            border-radius: 8px;

            border:
                1px solid
                rgba(129,140,248,0.25);

            background: #10182b;

            color: white;

            outline: none;

            font-size: 10px;
        }


        .status-select option {

            background: #10182b;

            color: white;
        }


        .update-status-btn {

            height: 39px;

            padding:
                0 18px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    100deg,
                    #6366f1,
                    #06b6d4
                );

            color: white;

            font-size: 10px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;
        }


        .update-status-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(99,102,241,0.25);
        }


        /* =========================================
           EMPTY
        ========================================= */

        .admin-empty {

            text-align: center;

            padding: 60px 20px;

            color: #68758b;
        }


        .admin-empty strong {

            display: block;

            color: #dbe4f0;

            margin-bottom: 7px;

            font-size: 14px;
        }


        /* =========================================
           TOAST
        ========================================= */

        .admin-toast {

            position: fixed;

            top: 90px;

            right: 25px;

            z-index: 9999;

            padding:
                13px 18px;

            border-radius: 10px;

            background: #111827;

            border:
                1px solid
                rgba(255,255,255,0.1);

            color: #dbeafe;

            font-size: 11px;

            display: none;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.4);
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 900px) {

            .admin-nav-links {
                display: none;
            }

            .admin-stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .complaint-details {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .status-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .status-controls {
                width: 100%;
            }

            .status-select {
                flex: 1;
            }

        }


        @media (max-width: 550px) {

            .admin-stats {
                grid-template-columns: 1fr;
            }

            .complaint-details {
                grid-template-columns: 1fr;
            }

            .status-controls {
                flex-direction: column;
            }

            .status-select,
            .update-status-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body class="admin-page">


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="admin-navbar">

        <a
            href="dashboard.html"
            class="admin-logo"
        >

            <span class="admin-logo-icon">
                R
            </span>

            <span>
                Resolve<span>X</span>
            </span>

        </a>


        <div class="admin-nav-links">

            <a
                href="admin.html"
                class="active"
            >
                Admin Panel
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="complaints.html">
                Student View
            </a>

        </div>


        <button
            class="admin-logout"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="admin-container">


        <span class="admin-label">
            ADMINISTRATION
        </span>


        <h1 class="admin-title">
            Manage
            <span>Complaints.</span>
        </h1>


        <p class="admin-description">

            Review student complaints and update their
            resolution status.

        </p>



        <!-- =====================================
             STATISTICS
        ====================================== -->

        <section class="admin-stats">


            <div class="admin-stat">

                <small>
                    Total Complaints
                </small>

                <strong id="adminTotal">
                    0
                </strong>

            </div>


            <div class="admin-stat">

                <small>
                    Submitted
                </small>

                <strong id="adminSubmitted">
                    0
                </strong>

            </div>


            <div class="admin-stat">

                <small>
                    In Progress
                </small>

                <strong id="adminProgress">
                    0
                </strong>

            </div>


            <div class="admin-stat">

                <small>
                    Resolved
                </small>

                <strong id="adminResolved">
                    0
                </strong>

            </div>


        </section>



        <!-- =====================================
             COMPLAINT LIST
        ====================================== -->

        <section class="admin-panel">


            <div class="admin-panel-header">

                <h2>
                    All Complaints
                </h2>


                <button
                    class="refresh-button"
                    onclick="loadAdminComplaints()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div id="adminComplaintList">

                <div class="admin-empty">

                    Loading complaints...

                </div>

            </div>


        </section>


    </main>



    <div
        id="adminToast"
        class="admin-toast"
    ></div>



    <script src="app.js"></script>


    <script>

        /* =========================================
           CHECK ADMIN
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                if (
                    typeof requireLogin === "function" &&
                    !requireLogin()
                ) {

                    return;

                }


                const user =
                    typeof getCurrentUser === "function"
                        ? getCurrentUser()
                        : null;


                if (
                    !user ||
                    user.role !== "admin"
                ) {

                    document.body.innerHTML = `

                        <div
                            style="
                                min-height:100vh;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                background:#070b17;
                                color:white;
                                text-align:center;
                                font-family:Arial,sans-serif;
                            "
                        >

                            <div>

                                <div
                                    style="
                                        font-size:45px;
                                        margin-bottom:15px;
                                    "
                                >
                                    🔒
                                </div>

                                <h2>
                                    Admin Access Required
                                </h2>

                                <p
                                    style="
                                        color:#7f8ba3;
                                    "
                                >
                                    You do not have permission
                                    to access this page.
                                </p>

                                <button
                                    onclick="
                                        window.location.href =
                                        'dashboard.html'
                                    "
                                    style="
                                        padding:11px 18px;
                                        border:none;
                                        border-radius:8px;
                                        background:#6366f1;
                                        color:white;
                                        cursor:pointer;
                                    "
                                >
                                    Go to Dashboard
                                </button>

                            </div>

                        </div>

                    `;

                    return;

                }


                await loadAdminComplaints();

            }
        );



        /* =========================================
           LOAD COMPLAINTS
        ========================================== */

        async function loadAdminComplaints() {

            const container =
                document.getElementById(
                    "adminComplaintList"
                );


            container.innerHTML = `

                <div class="admin-empty">
                    Loading complaints...
                </div>

            `;


            try {

                const complaints =
                    await apiRequest(
                        "/api/complaints"
                    );


                updateAdminStats(
                    complaints
                );


                renderAdminComplaints(
                    complaints
                );


            } catch (error) {

                console.error(
                    "Admin complaints error:",
                    error
                );


                container.innerHTML = `

                    <div class="admin-empty">

                        <strong>
                            Unable to load complaints
                        </strong>

                        ${escapeHtml(
                            error.message ||
                            "Something went wrong."
                        )}

                    </div>

                `;

            }

        }



        /* =========================================
           STATISTICS
        ========================================== */

        function updateAdminStats(
            complaints
        ) {

            document.getElementById(
                "adminTotal"
            ).textContent =
                complaints.length;


            document.getElementById(
                "adminSubmitted"
            ).textContent =
                complaints.filter(
                    c =>
                        c.status === "Submitted" ||
                        c.status === "Under Review"
                ).length;


            document.getElementById(
                "adminProgress"
            ).textContent =
                complaints.filter(
                    c =>
                        c.status === "In Progress"
                ).length;


            document.getElementById(
                "adminResolved"
            ).textContent =
                complaints.filter(
                    c =>
                        c.status === "Resolved"
                ).length;

        }



        /* =========================================
           RENDER
        ========================================== */

        function renderAdminComplaints(
            complaints
        ) {

            const container =
                document.getElementById(
                    "adminComplaintList"
                );


            if (
                !complaints ||
                complaints.length === 0
            ) {

                container.innerHTML = `

                    <div class="admin-empty">

                        <strong>
                            No complaints found
                        </strong>

                        Students have not submitted
                        any complaints yet.

                    </div>

                `;

                return;

            }


            container.innerHTML =
                complaints
                    .map(
                        complaint =>
                            createComplaintCard(
                                complaint
                            )
                    )
                    .join("");

        }



        /* =========================================
           COMPLAINT CARD
        ========================================== */

        function createComplaintCard(
            complaint
        ) {

            const date =
                complaint.createdAt
                    ? new Date(
                        complaint.createdAt
                    ).toLocaleDateString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        }
                    )
                    : "-";


            const studentName =
                complaint.user &&
                complaint.user.name
                    ? complaint.user.name
                    : "Student";


            const studentEmail =
                complaint.user &&
                complaint.user.email
                    ? complaint.user.email
                    : "-";


            return `

                <article
                    class="admin-complaint"
                >


                    <div
                        class="admin-complaint-top"
                    >

                        <div>

                            <h3
                                class="complaint-title"
                            >

                                ${escapeHtml(
                                    complaint.title
                                )}

                            </h3>


                            <p
                                class="complaint-description"
                            >

                                ${escapeHtml(
                                    complaint.description
                                )}

                            </p>

                        </div>

                    </div>



                    <!-- COMPLAINT INFORMATION -->

                    <div
                        class="complaint-details"
                    >


                        <div class="detail-box">

                            <small>
                                Student
                            </small>

                            <strong>

                                ${escapeHtml(
                                    studentName
                                )}

                                <br>

                                ${escapeHtml(
                                    studentEmail
                                )}

                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                Category
                            </small>

                            <strong>

                                ${escapeHtml(
                                    complaint.category
                                )}

                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                Priority
                            </small>

                            <strong>

                                ${escapeHtml(
                                    complaint.priority
                                )}

                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                Department
                            </small>

                            <strong>

                                ${escapeHtml(
                                    complaint.department
                                )}

                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                Submitted
                            </small>

                            <strong>

                                ${date}

                            </strong>

                        </div>


                    </div>



                    <!-- STATUS -->

                    <div class="status-section">


                        <div
                            class="current-status"
                        >

                            Current Status:

                            <strong>
                                ${escapeHtml(
                                    complaint.status
                                )}
                            </strong>

                        </div>



                        <div
                            class="status-controls"
                        >

                            <select
                                class="status-select"
                                id="status-${complaint._id}"
                            >

                                <option
                                    value="Submitted"
                                    ${
                                        complaint.status ===
                                        "Submitted"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Submitted
                                </option>


                                <option
                                    value="Under Review"
                                    ${
                                        complaint.status ===
                                        "Under Review"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Under Review
                                </option>


                                <option
                                    value="In Progress"
                                    ${
                                        complaint.status ===
                                        "In Progress"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    In Progress
                                </option>


                                <option
                                    value="Resolved"
                                    ${
                                        complaint.status ===
                                        "Resolved"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Resolved
                                </option>

                            </select>


                            <button
                                class="update-status-btn"
                                onclick="
                                    updateComplaintStatus(
                                        '${complaint._id}'
                                    )
                                "
                            >
                                Update
                            </button>

                        </div>


                    </div>


                </article>

            `;

        }



        /* =========================================
           UPDATE STATUS
        ========================================== */

        async function updateComplaintStatus(
            complaintId
        ) {

            const select =
                document.getElementById(
                    `status-${complaintId}`
                );


            const newStatus =
                select.value;


            try {

                await apiRequest(
                    `/api/complaints/${complaintId}`,
                    {

                        method: "PUT",

                        body:
                            JSON.stringify({
                                status: newStatus
                            })

                    }
                );


                showAdminToast(
                    `✓ Complaint updated to ${newStatus}`
                );


                /* Reload from MongoDB */

                await loadAdminComplaints();


            } catch (error) {

                console.error(
                    "Status update error:",
                    error
                );


                showAdminToast(
                    `❌ ${
                        error.message ||
                        "Unable to update complaint"
                    }`
                );

            }

        }



        /* =========================================
           TOAST
        ========================================== */

        function showAdminToast(
            message
        ) {

            const toast =
                document.getElementById(
                    "adminToast"
                );


            toast.textContent =
                message;


            toast.style.display =
                "block";


            setTimeout(
                () => {

                    toast.style.display =
                        "none";

                },
                2500
            );

        }



        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
